name: Scrape RNZ electorate results

# GitHub cron can't run more often than every 5 minutes, and it is often late
# or skipped, so each run loops internally, scraping every 2 minutes for up to
# ~5h50m (jobs are capped at 6h). When a run reaches its time limit while
# results are still changing, it starts the next run itself. The hourly
# schedule is only a backup. The concurrency group keeps one run at a time.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "How long to keep scraping (max ~350)"
        default: "350"
      interval_seconds:
        description: "Seconds between scrapes"
        default: "120"

permissions:
  contents: write
  actions: write   # lets a finished run start the next one

concurrency:
  group: scrape-rnz
  cancel-in-progress: false

jobs:
  scrape:
    # Kill switch: set repo variable SCRAPE_ENABLED=false to stop scheduled runs.
    if: vars.SCRAPE_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Scrape every 2 minutes
        id: loop
        env:
          INTERVAL_SECONDS: ${{ inputs.interval_seconds || '120' }}
          DURATION_MINUTES: ${{ inputs.duration_minutes || '350' }}
          # Stop early once counting goes quiet, to save Actions minutes.
          IDLE_MINUTES: ${{ vars.IDLE_MINUTES || '30' }}
        run: bash scraper/run_loop.sh

      # Self-chaining: only when the run hit its time limit (results still
      # moving). Idle or failed runs stop; the hourly schedule is a backup.
      - name: Start the next run
        if: steps.loop.outputs.ended == 'duration' && vars.SCRAPE_ENABLED != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_DURATION: ${{ inputs.duration_minutes || '350' }}
          NEXT_INTERVAL: ${{ inputs.interval_seconds || '120' }}
        run: |
          gh workflow run scrape.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f duration_minutes="$NEXT_DURATION" -f interval_seconds="$NEXT_INTERVAL"
