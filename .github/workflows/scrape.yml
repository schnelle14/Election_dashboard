name: Scrape RNZ electorate results

# GitHub cron can't run more often than every 5 minutes (and is often late),
# so each run loops internally, scraping every 2 minutes for ~58 minutes.
# The hourly schedule starts the next run; the concurrency group queues it
# behind the current one, so coverage is continuous.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "How long to keep scraping (max ~350)"
        default: "58"
      interval_seconds:
        description: "Seconds between scrapes"
        default: "120"

permissions:
  contents: write

concurrency:
  group: scrape-rnz
  cancel-in-progress: false

jobs:
  scrape:
    # Kill switch: set repo variable SCRAPE_ENABLED=false to stop scheduled runs.
    if: vars.SCRAPE_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Scrape every 2 minutes
        env:
          INTERVAL_SECONDS: ${{ inputs.interval_seconds || '120' }}
          DURATION_MINUTES: ${{ inputs.duration_minutes || '58' }}
          # Stop early once counting goes quiet, to save Actions minutes.
          IDLE_MINUTES: ${{ vars.IDLE_MINUTES || '30' }}
        run: bash scraper/run_loop.sh
